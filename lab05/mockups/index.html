<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yatzy Mock-up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Yatzy</h1></header>

  <main class="layout">
    <section class="dice-area">
      <h2>Dice</h2>
      <div class="dice">
        <div class="die">⚀</div>
        <div class="die">⚁</div>
        <div class="die">⚂</div>
        <div class="die">⚃</div>
        <div class="die">⚄</div>
      </div>
      <button>Roll</button>
    </section>

    <section class="scorecard">
      <h2>Scorecard</h2>
      <table>
        <tr><th>Category</th><th>Score</th></tr>
        <tr><td>Ones</td><td>—</td></tr>
        <tr><td>Twos</td><td>—</td></tr>
        <tr><td>Threes</td><td>—</td></tr>
        <tr><td>Full House</td><td>—</td></tr>
        <tr><td>Yatzy</td><td>—</td></tr>
      </table>
    </section>
  </main>
</body>
</html>
