<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yatzy Mock-up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Page title -->
  <header>
    <h1>Yatzy</h1>
  </header>

  <main class="layout">
    <!-- Dice panel – static mock-up (no JS) -->
    <section class="dice-area">
      <h2>Dice</h2>

      <!-- Using Unicode dice to visualize faces -->
      <div class="dice">
        <div class="die">⚀</div>
        <div class="die">⚁</div>
        <div class="die">⚂</div>
        <div class="die">⚃</div>
        <div class="die">⚄</div>
      </div>

      <!-- Primary action (mock only) -->
      <button>Roll</button>
    </section>

    <!-- Scorecard – simple table layout -->
    <section class="scorecard">
      <h2>Scorecard</h2>
      <table aria-label="Scorecard">
        <thead>
          <tr><th>Category</th><th>Score</th></tr>
        </thead>
        <tbody>
          <tr><td>Ones</td><td>—</td></tr>
          <tr><td>Twos</td><td>—</td></tr>
          <tr><td>Threes</td><td>—</td></tr>
          <tr><td>Full House</td><td>—</td></tr>
          <tr><td>Yatzy</td><td>—</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
